<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Studio // Open-Source AI Design Canvas</title>
  <meta http-equiv="refresh" content="0; url=editor/">
  <script>
    window.location.replace("editor/" + window.location.search + window.location.hash);
  </script>
  <style>
    body {
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loader {
      width: 32px;
      height: 32px;
      border: 3px solid #333;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #38bdf8; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>Opening Canvas Studio...</h2>
  <p><a href="editor/">Click here if you are not redirected automatically</a>.</p>
</body>
</html>
