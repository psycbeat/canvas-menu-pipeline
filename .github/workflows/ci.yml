name: Canvas Studio CI & Print Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Print Menu (Zero-Overflow Audit & PDF Compilation)
        run: npm run build:pdf

      - name: Start Canvas Studio Local Server
        run: |
          npm start &
          sleep 4

      - name: Run Full Test Suite (Responsive, Artboard Tool, 8-Format Exports)
        run: npm test

      - name: Upload Production PDF & Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crave-lab-print-and-export-artifacts
          path: |
            output/*.pdf
            output/*.png
            output/*.webp
            output/*.svg
            output/*.eps
            output/*.json
          retention-days: 14
