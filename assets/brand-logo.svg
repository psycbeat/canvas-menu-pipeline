<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="460" height="70">
  <!-- Minimalist Emblem in Botanical Green -->
  <rect x="10" y="14" width="38" height="38" rx="8" fill="#15803D"/>
  <text x="29" y="39" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">C</text>
  
  <!-- Clean Editorial Typography with Green Accent -->
  <text x="64" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" letter-spacing="4" fill="#181818">
    CRAVE<tspan font-weight="800" fill="#15803D">LAB</tspan>
  </text>
  
  <!-- Subtitle Tagline - Clean Unicode Bullet Points -->
  <text x="66" y="52" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.5" fill="#888888">
    ARTISANAL ROLLS &#8226; SMASH CRAFT &#8226; BOXES
  </text>

  <!-- Right Minimal Badge in Green -->
  <rect x="360" y="22" width="85" height="22" rx="11" fill="none" stroke="#BBF7D0" stroke-width="1.2" />
  <text x="402.5" y="36.5" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle" letter-spacing="1.5">
    EST. 2026
  </text>
</svg>
